<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Mando a Distancia TV</title>

<style>

body{
    margin:0;
    font-family:Arial;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

#mando{
    width:630px;
    background:linear-gradient(#767676,#181818);
    border-radius:40px;
    padding:50px;
    box-shadow:
    0px 10px 30px rgb(200, 217, 221),
    inset 0px 2px 10px #777;
}

#pantalla{
    background:#000000;
    color:#f1f5f1;
    font-family:Georgia, 'Times New Roman', Times, serif;
    font-size:xx-large;
    padding:55px;
    border-radius:40px;
    text-align:center;
    margin-bottom:20px;
    min-height:70px;
    box-shadow: inset 0px 0px 15px #00ff00;
}

.estado{

    font-size:44px;
    margin-bottom:50px;

}

.info{

    font-size:50px;

}

.grid{

display:grid;
grid-template-columns:repeat(3,1fr);
gap:50px;

}

button{
color:white;
font-weight: bold;
height:65px;
font-size:20px;
border:none;
border-radius:18px;
cursor:pointer;
background:linear-gradient(#eceff3,#5a5a59);
box-shadow:
0px 4px 5px rgb(71, 71, 71),
inset 0px 2px 3px white;

transition:.15s;

}

button:hover{

transform:scale(1.05);

}

button:active{

transform:translateY(3px);

}

.rojo{

background:linear-gradient(#eb0b0b,#e05151);
color:rgb(15, 15, 15);

}

.azul{

background:linear-gradient(#0e07cd,#947ef3);
color:white;
font-weight: bold;

}

.verde{

background:linear-gradient(#86ff86,#1d9e1d);
color:white;

}

.amarillo{

background:linear-gradient(#efef11,#e7fd7c);

}

#navegacion{

margin:20px auto;
width:220px;
display:grid;
grid-template-columns:70px 70px 70px;
grid-template-rows:70px 70px 70px;
gap:5px;

}

#ok{

background:linear-gradient(#88ff88,#148914);
color:rgb(255, 255, 255);
font-weight:bold;

}

</style>

</head>

<body>

<div id="mando">

<div id="pantalla">

<div class="estado" id="estado"><h1>TV APAGADA</h1></div>

<div class="info">Canal:
<span id="canal">1</span>

<br>

Volumen:
<span id="volumen">20</span>

</div>

</div>

<div class="grid">

<button class="rojo" onclick="power()">⏻</button>

<button onclick="mute()">🔇</button>

<button onclick="home()">🏠</button>

<button onclick="volMas()">VOL +</button>

<button onclick="canalMas()">CH +</button>

<button onclick="menu()">⚙</button>

<button onclick="volMenos()">VOL -</button>

<button onclick="canalMenos()">CH -</button>

<button onclick="info()">ℹ</button>

</div>

<div id="navegacion">

<div></div>

<button onclick="direccion('Arriba')">⬆</button>

<div></div>

<button onclick="direccion('Izquierda')">⬅</button>

<button id="ok" onclick="ok()">OK</button>

<button onclick="direccion('Derecha')">➡</button>

<div></div>

<button onclick="direccion('Abajo')">⬇</button>

<div></div>

</div>

<div class="grid">

<button onclick="numero(1)">1</button>
<button onclick="numero(2)">2</button>
<button onclick="numero(3)">3</button>

<button onclick="numero(4)">4</button>
<button onclick="numero(5)">5</button>
<button onclick="numero(6)">6</button>

<button onclick="numero(7)">7</button>
<button onclick="numero(8)">8</button>
<button onclick="numero(9)">9</button>

<button class="amarillo" onclick="numero('*')">*</button>
<button onclick="numero(0)">0</button>
<button class="azul" onclick="numero('#')">#</button>

</div>

</div>

<script>
let volumenanterior= volumen;

let encendida=false;

let volumen=20;

let canal=1;

function actualizar(){

    document.getElementById("volumen").innerHTML=volumen; //actualiza el html
    document.getElementById("canal").innerHTML=canal;
}

function power(){

    encendida=encendida;

    document.getElementById("estado").innerHTML= 
    encendida ? "TV ENCENDIDA" : "TV APAGADA";

}

function comprobar(){

if(!encendida){

alert("La TV está apagada");
return false;
}

return true;

}

function volMas(){

    if (!comprobar()) return;

    if(volumen<100)
    volumen++;

    actualizar();
}

function volMenos(){

    if (!comprobar()) return;

    if(volumen>0)
    volumen--;

    actualizar();
}

function canalMas(){
    if(!comprobar()) return;

    canal++;

    actualizar();
}

function canalMenos(){
    if(!comprobar()) return;

    if(canal>1)
    canal--;

    actualizar();

}

function mute(){


    if(!comprobar()) return;
    if(volumen>0){
        volumenanterior=volumen;
        volumen = 0;
    }
    else{

        //quiero restaurar el volumen anterior
        volumen = volumenanterior
    }
        actualizar();
    //if(comprobar()) return;

    //volumen=0;

    //actualizar();

}
</script>
